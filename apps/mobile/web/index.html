<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="porto_prime">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>porto_prime</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="https://js.stripe.com/v3/"></script>
  <script>
    window.portoPrimeStripeMount = function(containerId, publishableKey, clientSecret, attempt) {
      attempt = attempt || 0;
      const host = document.getElementById(containerId);
      if (!host) {
        if (attempt < 100) {
          window.setTimeout(function() {
            window.portoPrimeStripeMount(containerId, publishableKey, clientSecret, attempt + 1);
          }, 50);
        }
        return;
      }
      if (host.dataset.stripeMounted === 'true') return;
      host.dataset.stripeMounted = 'true';

      host.innerHTML = '<div id="' + containerId + '-payment"></div>' +
        '<div id="' + containerId + '-error" style="display:none;margin-top:12px;padding:12px 14px;border-radius:12px;background:#fff1d5;color:#17201e;font:600 13px Arial,sans-serif"></div>' +
        '<button id="' + containerId + '-pay" type="button" style="width:100%;height:56px;margin-top:18px;border:0;border-radius:16px;background:#00675e;color:white;font:800 15px Arial,sans-serif;cursor:pointer">Pagar com Stripe</button>' +
        '<div style="margin-top:12px;text-align:center;color:#6e7a76;font:600 11px Arial,sans-serif">Pagamento criptografado e processado pelo Stripe</div>';

      try {
        const stripe = Stripe(publishableKey);
        const elements = stripe.elements({
          clientSecret: clientSecret,
          appearance: {
            theme: 'stripe',
            variables: {
              colorPrimary: '#00675e',
              colorBackground: '#ffffff',
              colorText: '#17201e',
              colorDanger: '#df1b41',
              fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif',
              borderRadius: '14px',
              spacingUnit: '4px'
            },
            rules: {
              '.Input': { border: '1px solid #dfe6e2', boxShadow: 'none', padding: '13px' },
              '.Input:focus': { border: '1px solid #007f73', boxShadow: '0 0 0 1px #007f73' },
              '.Label': { fontWeight: '700', color: '#17201e' }
            }
          }
        });

        const paymentElement = elements.create('payment', {
          layout: { type: 'tabs', defaultCollapsed: false }
        });
        paymentElement.mount('#' + containerId + '-payment');

        const button = document.getElementById(containerId + '-pay');
        const errorBox = document.getElementById(containerId + '-error');

        paymentElement.on('ready', function() {
          window.dispatchEvent(new CustomEvent('porto-prime-stripe-ready'));
        });

        paymentElement.on('loaderror', function(event) {
          errorBox.style.display = 'block';
          errorBox.textContent = (event && event.error && event.error.message) || 'Não foi possível carregar o formulário do Stripe.';
        });

        button.addEventListener('click', async function() {
          button.disabled = true;
          button.textContent = 'Processando pagamento...';
          errorBox.style.display = 'none';

          const result = await stripe.confirmPayment({
            elements: elements,
            redirect: 'if_required',
            confirmParams: { return_url: window.location.href }
          });

          if (result.error) {
            errorBox.style.display = 'block';
            errorBox.textContent = result.error.message || 'Não foi possível concluir o pagamento.';
            button.disabled = false;
            button.textContent = 'Pagar com Stripe';
            return;
          }

          button.textContent = 'Pagamento confirmado';
          window.dispatchEvent(new CustomEvent('porto-prime-stripe-paid'));
        });
      } catch (error) {
        const errorBox = document.getElementById(containerId + '-error');
        if (errorBox) {
          errorBox.style.display = 'block';
          errorBox.textContent = error && error.message ? error.message : String(error);
        }
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
