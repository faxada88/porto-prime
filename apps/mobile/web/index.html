<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A312D">
  <meta name="description" content="Porto Prime Delivery — conveniência, bebidas e entrega em Porto Seguro.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Porto Prime">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Porto Prime Delivery</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body, flt-glass-pane, flutter-view {
      -webkit-tap-highlight-color: transparent !important;
      -webkit-touch-callout: none;
    }
    button, a, input, textarea, [role="button"] {
      -webkit-tap-highlight-color: transparent !important;
    }
    input, textarea, select {
      font-size: 16px !important;
    }
    body {
      overscroll-behavior-y: none;
      background: #f6f7f3;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Porto Prime signature bell; unlocked only by a user gesture.
    let portoPrimeAudio;
    const portoPrimeChimeNodes = new Set();
    function unlockPortoPrimeAudio() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        portoPrimeAudio = !portoPrimeAudio || portoPrimeAudio.state === 'closed' ? new AudioContext() : portoPrimeAudio;
        if (portoPrimeAudio.state !== 'running') portoPrimeAudio.resume().catch(function() {});
      } catch (_) {}
    }
    window.addEventListener('pointerdown', unlockPortoPrimeAudio, { passive: true });
    window.addEventListener('keydown', unlockPortoPrimeAudio);
    window.portoPrimeStopDeliveryChime = function() {
      for (const oscillator of portoPrimeChimeNodes) { try { oscillator.stop(); } catch (_) {} }
      portoPrimeChimeNodes.clear();
    };
    window.portoPrimePlayDeliveryChime = function() {
      if (!portoPrimeAudio || portoPrimeAudio.state !== 'running') return;
      window.portoPrimeStopDeliveryChime();
      const start = portoPrimeAudio.currentTime;
      const notes = [659.25, 830.61, 987.77, 1318.51];
      const offsets = [0, .16, .32, .68];
      notes.forEach(function(frequency, index) {
        [1, 2].forEach(function(harmonic) {
          const oscillator = portoPrimeAudio.createOscillator();
          const gain = portoPrimeAudio.createGain();
          const at = start + offsets[index];
          oscillator.type = 'sine';
          oscillator.frequency.value = frequency * harmonic;
          gain.gain.setValueAtTime(0, at);
          gain.gain.linearRampToValueAtTime(harmonic === 1 ? .16 : .035, at + .012);
          gain.gain.exponentialRampToValueAtTime(.001, at + .60);
          gain.gain.linearRampToValueAtTime(0, at + .65);
          oscillator.connect(gain); gain.connect(portoPrimeAudio.destination);
          portoPrimeChimeNodes.add(oscillator);
          oscillator.start(at); oscillator.stop(at + .66);
          oscillator.onended = function() { portoPrimeChimeNodes.delete(oscillator); oscillator.disconnect(); gain.disconnect(); };
        });
      });
    };

    window.portoPrimeLoadStripe = function() {
      if (window.Stripe) return Promise.resolve(window.Stripe);
      if (window.__portoPrimeStripePromise) return window.__portoPrimeStripePromise;

      window.__portoPrimeStripePromise = new Promise(function(resolve, reject) {
        const script = document.createElement('script');
        script.src = 'https://js.stripe.com/v3/';
        script.async = true;
        script.onload = function() {
          if (window.Stripe) resolve(window.Stripe);
          else reject(new Error('Stripe não ficou disponível após o carregamento.'));
        };
        script.onerror = function() {
          reject(new Error('Não foi possível carregar o Stripe.'));
        };
        document.head.appendChild(script);
      });

      return window.__portoPrimeStripePromise;
    };

    window.portoPrimeStripeMount = async function(containerId, publishableKey, clientSecret, attempt, onPaymentState) {
      attempt = attempt || 0;
      const host = document.getElementById(containerId);
      if (!host) {
        if (attempt < 100) {
          window.setTimeout(function() {
            window.portoPrimeStripeMount(containerId, publishableKey, clientSecret, attempt + 1, onPaymentState);
          }, 50);
        }
        return;
      }
      if (host.dataset.stripeMounted === 'true') return;
      host.dataset.stripeMounted = 'true';

      host.innerHTML = '<div id="' + containerId + '-payment"></div>' +
        '<div id="' + containerId + '-error" style="display:none;margin-top:12px;padding:13px 14px;border:1px solid #f2d0c8;border-radius:16px;background:#ffeae4;color:#4f2a23;font:650 13px system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;line-height:1.45"></div>' +
        '<button id="' + containerId + '-pay" type="button" disabled style="width:100%;height:56px;margin-top:18px;border:0;border-radius:18px;background:#0c4e47;color:white;font:800 15px system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;cursor:pointer;box-shadow:0 14px 34px rgba(10,49,45,.16)">Pagar</button>' +
        '<div id="' + containerId + '-status" role="status" aria-live="polite" style="display:none;margin-top:16px;color:#0c4e47;font:600 14px system-ui;line-height:1.5"></div>' +
        '<div style="margin-top:12px;text-align:center;color:#697773;font:650 11px system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">Pagamento criptografado e processado pelo Stripe</div>';

      try {
        await window.portoPrimeLoadStripe();
        const stripe = window.Stripe(publishableKey);
        const elements = stripe.elements({
          clientSecret: clientSecret,
          appearance: {
            theme: 'stripe',
            variables: {
              colorPrimary: '#0c4e47',
              colorBackground: '#ffffff',
              colorText: '#15201d',
              colorDanger: '#e85f48',
              fontFamily: 'system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif',
              fontSizeBase: '16px',
              borderRadius: '16px',
              spacingUnit: '4px'
            },
            rules: {
              '.Input': { border: '1px solid #e4e9e5', boxShadow: 'none', padding: '14px 15px', backgroundColor: '#fbfcfa' },
              '.Input:focus': { border: '1px solid #14a08e', boxShadow: '0 0 0 3px rgba(20,160,142,.10)', backgroundColor: '#ffffff' },
              '.Label': { fontWeight: '700', color: '#34413d', marginBottom: '7px' },
              '.Tab': { border: '1px solid #e4e9e5', boxShadow: 'none' },
              '.Tab--selected': { borderColor: '#83d7c8', backgroundColor: '#f0faf7' }
            }
          }
        });

        const paymentElement = elements.create('payment', {
          layout: { type: 'tabs', defaultCollapsed: false }
        });
        paymentElement.mount('#' + containerId + '-payment');

        const button = document.getElementById(containerId + '-pay');
        const errorBox = document.getElementById(containerId + '-error');

        paymentElement.on('ready', function() {
          window.dispatchEvent(new CustomEvent('porto-prime-stripe-ready'));
        });

        paymentElement.on('loaderror', function(event) {
          errorBox.style.display = 'block';
          errorBox.textContent = (event && event.error && event.error.message) || 'Não foi possível carregar o formulário do Stripe.';
        });

        button.disabled = true;
        paymentElement.on('ready', function() { button.disabled = false; });
        button.addEventListener('click', async function() {
          if (button.disabled) return;
          button.disabled = true;
          button.textContent = 'Processando…';
          errorBox.style.display = 'none';
          if (onPaymentState) onPaymentState('submitting');
          try {
            const result = await stripe.confirmPayment({
              elements: elements,
              redirect: 'if_required',
              confirmParams: { return_url: window.location.href }
            });
            if (result.error) throw new Error(result.error.message || 'Não foi possível concluir o pagamento.');
            const status = result.paymentIntent && result.paymentIntent.status;
            if (status !== 'succeeded' && status !== 'processing') {
              throw new Error('O pagamento ainda não foi concluído. Confira os dados e tente novamente.');
            }
            // A Stripe response triggers server verification; it never marks an order paid locally.
            button.hidden = true;
            const statusBox = document.getElementById(containerId + '-status');
            statusBox.style.display = 'block';
            statusBox.textContent = status === 'processing'
                ? 'Pagamento em processamento. Estamos verificando seu pedido.'
                : 'Verificando pagamento e atualizando seu pedido…';
            if (onPaymentState) onPaymentState(status);
          } catch (error) {
            errorBox.style.display = 'block';
            errorBox.textContent = error && error.message ? error.message : 'Não foi possível concluir o pagamento.';
            button.disabled = false;
            button.textContent = 'Pagar';
            if (onPaymentState) onPaymentState('error');
          }
        });
      } catch (error) {
        const errorBox = document.getElementById(containerId + '-error');
        if (errorBox) {
          errorBox.style.display = 'block';
          errorBox.textContent = error && error.message ? error.message : String(error);
        }
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
