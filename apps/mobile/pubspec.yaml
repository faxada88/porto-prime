name: porto_prime
description: "Porto Prime delivery"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  lucide_icons_flutter: ^3.1.22
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  image_picker: ^1.2.4
  http: ^1.5.0
  url_launcher: ^6.3.2
  flutter_stripe: ^14.1.0
  flutter_stripe_web: ^8.2.0
  web: ^1.1.1
  shared_preferences: ^2.5.3
  socket_io_client: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Os controles nativos do framework (calendário, seleção de texto) precisam
  # desse asset. A iconografia própria da aplicação continua exclusivamente Lucide.
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
